name: ChronoFlow
options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "27.2"
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  useBaseInternationalization: false
  indentWidth: 4
  tabWidth: 4
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
packages:
  ChronoFlowKit:
    path: Packages/ChronoFlowKit
targets:
  ChronoFlow:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        PRODUCT_BUNDLE_IDENTIFIER: net.chronoflow.app.native
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: ChronoFlowKit
        products: [DesignSystem, AppCore, Launch, Welcome]
  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    settings:
      TARGETED_DEVICE_FAMILY: "1"
      SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      PRODUCT_BUNDLE_IDENTIFIER: net.chronoflow.app.native.tests
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ChronoFlow.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ChronoFlow"
      BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: ChronoFlow
  AppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    settings:
      TARGETED_DEVICE_FAMILY: "1"
      SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      PRODUCT_BUNDLE_IDENTIFIER: net.chronoflow.app.native.uitests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ChronoFlow
  PerfUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PerfUITests]
    settings:
      TARGETED_DEVICE_FAMILY: "1"
      SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      PRODUCT_BUNDLE_IDENTIFIER: net.chronoflow.app.native.perftests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ChronoFlow
schemes:
  ChronoFlow:
    build:
      targets:
        ChronoFlow: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AppTests
        - AppUITests
        - package: ChronoFlowKit/DesignSystemTests
        - package: ChronoFlowKit/AppCoreTests
        - package: ChronoFlowKit/LaunchTests
        - package: ChronoFlowKit/WelcomeTests
  Perf:
    build:
      targets:
        ChronoFlow: all
    run:
      config: Release
    test:
      config: Release
      targets: [PerfUITests]
    profile:
      config: Release
