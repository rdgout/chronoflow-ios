name: ChronoFlow
options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "27.2"
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  useBaseInternationalization: false
  indentWidth: 4
  tabWidth: 4
  postGenCommand: python3 -I Scripts/configure-icon-project.py
configs:
  Debug: debug
  Release: release
  Perf: release
  DeviceSigned: debug
configFiles:
  DeviceSigned: Config/Base.xcconfig
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
  Perf: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": YES
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    "DEVELOPMENT_TEAM[sdk=iphonesimulator*]": ""
    "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": ""
packages:
  ChronoFlowKit:
    path: Packages/ChronoFlowKit
targets:
  ChronoFlow:
    configFiles:
      DeviceSigned: Config/DeviceSigned.xcconfig
      Release: Config/DeviceSigning.xcconfig
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist, ChronoFlow.icon]
      - path: App/ChronoFlow.icon
        type: file
        buildPhase: resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        PRODUCT_BUNDLE_IDENTIFIER: net.chronoflow.app.native
        ASSETCATALOG_COMPILER_APPICON_NAME: ChronoFlow
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          INFOPLIST_FILE: "$(DERIVED_FILE_DIR)/ChronoFlow-Debug-Info.plist"
        Perf:
          CHRONOFLOW_READINESS: signed-out
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CHRONOFLOW_TIMELINE_PERF"
    preBuildScripts:
      - name: Generate Debug URL registration
        script: |
          if [ "$CONFIGURATION" = Debug ]; then
            python3 -I "$SRCROOT/Scripts/make-debug-info.py" "$SRCROOT/App/Info.plist" "$DERIVED_FILE_DIR/ChronoFlow-Debug-Info.plist"
          fi
        inputFiles: ["$(SRCROOT)/App/Info.plist", "$(SRCROOT)/Scripts/make-debug-info.py"]
        outputFiles: ["$(DERIVED_FILE_DIR)/ChronoFlow-Debug-Info.plist"]
        basedOnDependencyAnalysis: false
      - name: Require device signing for associated domains
        script: sh "$SRCROOT/Scripts/check-device-entitlements.sh"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: ChronoFlowKit
        products: [DesignSystem, AppCore, LocalStore, DataAccess, Sync, PlanCore, PlanUI, Settings, Reminders, TripWizard, TripWizardUI, Launch, Welcome, Auth]
  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
        excludes: [__Snapshots__]
      - path: Packages/ChronoFlowKit/Tests/ToolingTests/LaunchImageComparison.swift
      - path: Packages/ChronoFlowKit/Tests/LaunchTests/LaunchSnapshotCase.swift
      - path: Packages/ChronoFlowKit/Tests/SnapshotSupport
        excludes: [profiles.json]
    settings:
      TARGETED_DEVICE_FAMILY: "1"
      SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      PRODUCT_BUNDLE_IDENTIFIER: net.chronoflow.app.native.tests
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ChronoFlow.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ChronoFlow"
      BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: ChronoFlow
  ReleaseReadinessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ReleaseReadinessTests
    settings:
      TARGETED_DEVICE_FAMILY: "1"
      SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      PRODUCT_BUNDLE_IDENTIFIER: net.chronoflow.app.native.releasereadinesstests
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ChronoFlow.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ChronoFlow"
      BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: ChronoFlow
  RenderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RenderTests
      - path: AppTests/WelcomeTestWindow.swift
      - path: AppTests/SnapshotContainer.swift
      - path: AppTests/RasterPixels.swift
      - path: Packages/ChronoFlowKit/Tests/SnapshotSupport
        excludes: [profiles.json]
    settings:
      TARGETED_DEVICE_FAMILY: "1"
      SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      PRODUCT_BUNDLE_IDENTIFIER: net.chronoflow.app.native.rendertests
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ChronoFlow.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ChronoFlow"
      BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: ChronoFlow
  AppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
      - path: Packages/ChronoFlowKit/Tests/ToolingTests/BackoffPoll.swift
      - path: Packages/ChronoFlowKit/Sources/DataAccess/UITestSeedCommand.swift
      - path: Packages/ChronoFlowKit/Tests/ToolingTests/LaunchImageComparison.swift
      - path: Packages/ChronoFlowKit/Tests/ToolingTests/FrameStability.swift
      - path: Packages/ChronoFlowKit/Tests/ToolingTests/AuthScrollGesture.swift
      - path: Packages/ChronoFlowKit/Tests/ToolingTests/AuthAuditPolicy.swift
      - path: Packages/ChronoFlowKit/Tests/SnapshotSupport/RenderedTextContrast.swift
      - path: Packages/ChronoFlowKit/Tests/SnapshotSupport/PlanLayoutEvidence.swift
      - path: Packages/ChronoFlowKit/Tests/SnapshotSupport/SnapshotReference.swift
      - path: Packages/ChronoFlowKit/Tests/SnapshotSupport/WelcomeSnapshotPixels.swift
      - path: AppTests/WelcomeAuditPolicy.swift
      - path: Packages/ChronoFlowKit/Sources/DataAccess/Mock/MockScenarioValues.swift
    settings:
      TARGETED_DEVICE_FAMILY: "1"
      SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      PRODUCT_BUNDLE_IDENTIFIER: net.chronoflow.app.native.uitests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ChronoFlow
      - package: ChronoFlowKit
        products: [Launch, DesignSystem]
  PerfUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PerfUITests
      - Packages/ChronoFlowKit/Tests/PlanUITests/TimelineBudgetMetric.swift
    settings:
      TARGETED_DEVICE_FAMILY: "1"
      SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      PRODUCT_BUNDLE_IDENTIFIER: net.chronoflow.app.native.perftests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ChronoFlow
schemes:
  ChronoFlow:
    build:
      targets:
        ChronoFlow: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: AppTests
          parallelizable: true
        - name: RenderTests
          parallelizable: true
        - name: AppUITests
          parallelizable: true
        - package: ChronoFlowKit/DesignSystemTests
  PackageLogic:
    build:
      targets:
        ChronoFlow: [test]
    test:
      config: Debug
      targets:
        - package: ChronoFlowKit/DesignSystemTests
        - package: ChronoFlowKit/LaunchTests
        - package: ChronoFlowKit/WelcomeTests
  ReadinessRelease:
    build:
      targets:
        ChronoFlow: all
    test:
      config: Release
      targets: [ReleaseReadinessTests]
  Perf:
    build:
      targets:
        ChronoFlow: all
    run:
      config: Perf
    test:
      config: Perf
      targets: [PerfUITests]
    profile:
      config: Perf
