/* Active trip card without the sky gradient: a plain card with a dawn edge. */
.cf-trip-flat .bg-sky {
  background-image: none;
  background-color: var(--card);
  color: var(--card-foreground);
  border-color: var(--dawn);
  box-shadow: inset 0 0 0 1px var(--dawn), var(--shadow-soft);
  --dawn-text: inherit;
}

/* Glass material: the sticky header and the floating tab bar. */
.cf-glass-bar {
  background: color-mix(in oklab, var(--background) 72%, transparent);
  -webkit-backdrop-filter: blur(20px) saturate(1.8);
  backdrop-filter: blur(20px) saturate(1.8);
  border-bottom: 1px solid color-mix(in oklab, var(--border) 70%, transparent);
}
.cf-glass {
  background: color-mix(in oklab, var(--card) 72%, transparent);
  -webkit-backdrop-filter: blur(24px) saturate(1.8);
  backdrop-filter: blur(24px) saturate(1.8);
  border: 1px solid color-mix(in oklab, var(--border) 70%, transparent);
  box-shadow: var(--shadow-soft);
}

/* Touch: everything pressable gives feedback on press; no hover states needed. */
.cf-press {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  cursor: pointer;
  transition: transform 120ms ease, opacity 120ms ease;
}
.cf-press:active { transform: scale(0.97); opacity: 0.85; }
@media (prefers-reduced-motion: reduce) {
  .cf-press { transition: none; }
  .cf-press:active { transform: none; }
}

/* Touch-sized text fields (the Field component is desktop-sized). */
.cf-touch input {
  height: 48px;
  padding: 0 14px;
  font-size: 16px;
  border-radius: 14px;
  background: var(--card);
}

.cf-sky {
  --dawn-text: var(--dawn);
  background-image: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) var(--sky-mid-stop), var(--sky-horizon) 100%);
}

/* ---- System (iOS 26) components, drawn as the OS shows them. Not ours to restyle. ---- */

  border: 0.5px solid rgba(255, 255, 255, 0.6);
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.55);
}
[data-theme="dark"] .ios-glass {
  background: color-mix(in oklab, var(--background) 52%, transparent);
  border-color: rgba(255, 255, 255, 0.14);
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
/* Floating Liquid Glass tab bar */
.ios-tabbar { position: absolute; left: 20px; right: 20px; bottom: 22px; z-index: 20; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 4px; height: 62px; box-sizing: border-box; border-radius: 9999px; }
.ios-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 9999px; font-size: 10px; line-height: 12px; font-weight: 600; text-decoration: none; color: var(--foreground); }
.ios-tab[aria-current="page"] { color: var(--dawn-text); background: rgba(120, 120, 128, 0.16); }
[data-theme="dark"] .ios-tab[aria-current="page"] { background: rgba(120, 120, 128, 0.32); }
/* Side tab rail (iPhone Duo unfolded, iPad) */
.ios-rail { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; width: 68px; box-sizing: border-box; border-radius: 34px; }
.ios-rail .ios-tab { width: 56px; height: 56px; }

.ios-navbtn { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 9999px; color: var(--foreground); text-decoration: none; }
.ios-back { display: inline-flex; align-items: center; gap: 2px; height: 44px; padding: 0 14px 0 8px; box-sizing: border-box; border-radius: 9999px; color: var(--foreground); text-decoration: none; font-size: 17px; line-height: 22px; }
.ios-navbar { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: minmax(44px, auto) minmax(0, 1fr) minmax(44px, auto); align-items: center; gap: 8px; height: 54px; padding: 0 12px; box-sizing: border-box; }
.ios-navtitle { margin: 0; text-align: center; font-size: 17px; line-height: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ios-largetitle { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 41px; letter-spacing: -0.01em; }
/* Segmented control */
.ios-seg { display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; gap: 0; padding: 2px; height: 36px; box-sizing: border-box; border-radius: 9999px; background: rgba(118, 118, 128, 0.12); }
[data-theme="dark"] .ios-seg { background: rgba(118, 118, 128, 0.24); }
.ios-seg button { border: 0; border-radius: 9999px; background: transparent; color: var(--foreground); font: inherit; font-size: 13px; line-height: 18px; font-weight: 500; padding: 0 12px; min-height: 32px; }
.ios-seg button[aria-checked="true"] { background: #fff; color: #000; font-weight: 600; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 3px 1px rgba(0, 0, 0, 0.04); }
[data-theme="dark"] .ios-seg button[aria-checked="true"] { background: #636366; color: #fff; }
/* Switch: system shape, amber track when on */
.ios-switch { position: relative; flex-shrink: 0; width: 51px; height: 31px; border-radius: 9999px; background: rgba(120, 120, 128, 0.16); transition: background 150ms ease; }
[data-theme="dark"] .ios-switch { background: rgba(120, 120, 128, 0.32); }
.ios-switch[data-on="true"] { background: var(--dawn); }
.ios-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 9999px; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 3px 1px rgba(0, 0, 0, 0.06); transition: left 150ms ease; }
.ios-switch[data-on="true"]::after { left: 22px; }
/* Alert */
.ios-alert { width: 300px; box-sizing: border-box; padding: 22px 16px 16px; border-radius: 34px; text-align: center; display: flex; flex-direction: column; gap: 6px; }
.ios-alert h2 { margin: 0; font-size: 17px; line-height: 22px; font-weight: 600; }
.ios-alert p { margin: 0; font-size: 15px; line-height: 20px; }
.ios-alert-btn { display: flex; align-items: center; justify-content: center; min-height: 48px; border: 0; border-radius: 9999px; background: rgba(120, 120, 128, 0.16); color: var(--foreground); font: inherit; font-size: 17px; font-weight: 500; text-decoration: none; }
[data-theme="dark"] .ios-alert-btn { background: rgba(120, 120, 128, 0.32); }
.ios-alert-btn[data-role="destructive"] { color: #ff3b30; }
[data-theme="dark"] .ios-alert-btn[data-role="destructive"] { color: #ff453a; }
.ios-alert-btn[data-role="default"] { background: var(--dawn); color: #1c1307; font-weight: 600; }
