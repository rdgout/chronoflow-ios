<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Preferences</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/chronoflow/components/bundle.css">
<script src="ds/chronoflow/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Figtree';src:url("/_blob/74876cc764ebb15bf4ae98bcdbf3140c") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/741b1ce40b46479a73d934d0d5be9774") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/079d83fda74d66d1f31e35072f71201d") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/991830890debdac04981f1a27656ed5c") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url("/_blob/fc815083784d00806d267d81858d2414") format("woff2");font-weight:400 500;font-style:normal;font-display:swap}
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" lang="{{lang}}" style="position: relative; width: 375px; height: 812px; overflow: hidden; background: var(--background); color: var(--foreground); font-family: var(--font-sans);">
  <div style="position: absolute; inset: 0; overflow-y: auto;">
    <header class="ios ios-navbar">
      <span><a href="{{t.backHref}}" class="ios ios-glass ios-back"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>{{t.back}}</a></span>
      <span></span>
      <span></span>
    </header>

    <main style="padding: 4px 16px 40px; display: flex; flex-direction: column; gap: 24px;">
      <h1 class="ios-largetitle">{{t.title}}</h1>

      <section style="display: flex; flex-direction: column; gap: 16px; padding: 20px; border-radius: 26px; border: 1px solid var(--border); background: var(--card); box-shadow: var(--shadow-soft);">
        <h2 style="margin: 0; font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted-foreground);">{{t.appearance}}</h2>
        <sc-for list="{{choiceQs}}" as="q" hint-placeholder-count="2">
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <p id="{{q.labelId}}" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 500;">{{q.label}}</p>
            <div role="radiogroup" aria-labelledby="{{q.labelId}}" style="display: flex; flex-wrap: wrap; gap: 8px;">
              <sc-for list="{{q.options}}" as="o" hint-placeholder-count="3">
                <button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="{{o.style}}"><sc-if value="{{o.selected}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--dawn-text);"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>{{o.label}}</button>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </section>

      <section style="display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <h2 style="margin: 0; font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted-foreground);">{{t.categories}}</h2>
          <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--muted-foreground);">{{t.categoriesHint}}</p>
        </div>
        <div style="border-radius: 22px; border: 1px solid var(--border); background: var(--card); overflow: hidden;">
          <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
            <button type="button" role="switch" aria-checked="{{c.checked}}" onClick="{{c.toggle}}" style="{{c.rowStyle}}">
              <x-import component-from-global-scope="ChronoFlow.CategorySwatch" category="{{c.category}}" size="sm"></x-import>
              <span style="flex: 1; min-width: 0; font-size: 16px; line-height: 24px;">{{c.label}}</span>
              <span aria-hidden="true" class="ios-switch" data-on="{{c.checked}}"></span>
            </button>
          </sc-for>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 8px;">
        <div style="border-radius: 22px; border: 1px solid var(--border); background: var(--card); overflow: hidden;">
          <button type="button" role="switch" aria-checked="{{opt.checked}}" onClick="{{opt.toggle}}" class="cf-press" style="display: flex; width: 100%; align-items: center; gap: 12px; min-height: 64px; padding: 10px 16px; box-sizing: border-box; border: 0; background: transparent; color: var(--card-foreground); font: inherit; text-align: left;">
            <span style="flex: 1; min-width: 0;"><span style="display: block; font-size: 16px; line-height: 24px; font-weight: 500;">{{t.optional}}</span><span style="display: block; font-size: 14px; line-height: 20px; color: var(--muted-foreground);">{{t.optionalSub}}</span></span>
            <span aria-hidden="true" class="ios-switch" data-on="{{opt.checked}}"></span>
          </button>
        </div>
      </section>

      <div style="border-radius: 22px; border: 1px solid var(--border); background: var(--card); overflow: hidden;">
        <a href="SetReminders.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 16px; box-sizing: border-box; color: var(--card-foreground); text-decoration: none;">
          <span aria-hidden="true" style="display: grid; place-items: center; width: 36px; height: 36px; flex-shrink: 0; border-radius: 9999px; background: var(--muted);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg></span>
          <span style="flex: 1; min-width: 0;"><span style="display: block; font-size: 16px; line-height: 24px; font-weight: 500;">{{t.reminders}}</span><span style="display: block; font-size: 14px; line-height: 20px; color: var(--muted-foreground);">{{t.remindersSub}}</span></span>
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; color: var(--muted-foreground);"><path d="m9 18 6-6-6-6"></path></svg>
        </a>
        <a href="WalkthroughReplay.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 16px; box-sizing: border-box; border-top: 1px solid var(--border); color: var(--card-foreground); text-decoration: none;">
          <span aria-hidden="true" style="display: grid; place-items: center; width: 36px; height: 36px; flex-shrink: 0; border-radius: 9999px; background: var(--muted);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg></span>
          <span style="flex: 1; min-width: 0;"><span style="display: block; font-size: 16px; line-height: 24px; font-weight: 500;">{{t.walkthrough}}</span><span style="display: block; font-size: 14px; line-height: 20px; color: var(--muted-foreground);">{{t.walkthroughSub}}</span></span>
        </a>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"lang":{"editor":"enum","options":["en","nl"],"default":"en"},"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { appearance: 'system', time: '24', cats: { sleep: true, light: true, caffeine: true, travel: false }, optional: true };
  }
  renderVals() {
    const nl = (this.props.lang ?? 'en') === 'nl';
    const t = nl ? {
      back: 'Instellingen', backHref: 'SetHomeNL.dc.html', title: 'Voorkeuren', appearance: 'Weergave',
      theme: 'Thema', themeOpts: ['Systeem', 'Licht', 'Donker'],
      time: 'Tijdnotatie', timeOpts: ['24-uursnotatie (14:30)', '12-uursnotatie (2:30 PM)'],
      categories: 'Tijdlijncategorieën', categoriesHint: 'Verberg een categorie om je tijdlijn rustiger te maken. De stappen blijven gewoon in je plan.',
      cats: ['Slaap', 'Licht', 'Cafeïne', 'Reizen'],
      optional: 'Optionele stappen tonen', optionalSub: 'Stappen die fijn zijn maar niet nodig. Ook te wijzigen op de reispagina.',
      reminders: 'Verbinding en herinneringen', remindersSub: 'Aan, 30 minuten van tevoren · werkt ook offline',
      walkthrough: 'Rondleiding opnieuw bekijken', walkthroughSub: 'De korte uitleg die je bij je eerste reis zag'
    } : {
      back: 'Settings', backHref: 'SetHome.dc.html', title: 'Preferences', appearance: 'Appearance',
      theme: 'Theme', themeOpts: ['System', 'Light', 'Dark'],
      time: 'Time format', timeOpts: ['24-hour (14:30)', '12-hour (2:30 PM)'],
      categories: 'Timeline categories', categoriesHint: 'Hide a category to keep your timeline calmer. Its steps stay in your plan.',
      cats: ['Sleep', 'Light', 'Caffeine', 'Travel'],
      optional: 'Show optional items', optionalSub: 'Nice-if-you-can steps. You can also switch this on the trip page.',
      reminders: 'Connectivity & reminders', remindersSub: 'On, 30 min ahead · works offline',
      walkthrough: 'Replay walkthrough', walkthroughSub: 'The short tour from your first trip'
    };
    const pill = (on) =>
      'display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; box-sizing: border-box; border-radius: 9999px; font-family: var(--font-sans); font-size: 14px; line-height: 20px; background: var(--card); color: var(--foreground); ' +
      (on ? 'border: 2px solid var(--dawn); font-weight: 600;' : 'border: 2px solid var(--border); font-weight: 500;');
    const group = (key, label, ids, labels) => ({
      label, labelId: 'label-' + key,
      options: ids.map((id, i) => ({
        id, label: labels[i], selected: this.state[key] === id, checked: this.state[key] === id ? 'true' : 'false',
        style: pill(this.state[key] === id), pick: () => this.setState({ [key]: id })
      }))
    });
    const catDefs = [
      { id: 'sleep', category: 'sleep' }, { id: 'light', category: 'seek_light' },
      { id: 'caffeine', category: 'caffeine_serving' }, { id: 'travel', category: 'flight' }
    ];
    const track = (on) => 'position: relative; flex-shrink: 0; width: 52px; height: 32px; border-radius: 9999px; background: ' + (on ? 'var(--primary)' : 'color-mix(in oklab, var(--muted-foreground) 40%, transparent)') + ';';
    const knob = (on) => 'position: absolute; top: 3px; left: ' + (on ? '23px' : '3px') + '; width: 26px; height: 26px; border-radius: 9999px; background: ' + (on ? 'var(--primary-foreground)' : 'var(--card)') + '; box-shadow: var(--shadow-soft);';
    const optOn = this.state.optional;
    return {
      theme: this.props.theme ?? 'light',
      lang: nl ? 'nl' : 'en',
      t,
      opt: { checked: optOn ? 'true' : 'false', trackStyle: track(optOn), knobStyle: knob(optOn), toggle: () => this.setState({ optional: !this.state.optional }) },
      choiceQs: [
        group('appearance', t.theme, ['system', 'light', 'dark'], t.themeOpts),
        group('time', t.time, ['24', '12'], t.timeOpts)
      ],
      cats: catDefs.map((c, i) => {
        const on = this.state.cats[c.id];
        return {
          ...c, label: t.cats[i], checked: on ? 'true' : 'false',
          toggle: () => this.setState({ cats: { ...this.state.cats, [c.id]: !on } }),
          rowStyle: 'display: flex; width: 100%; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; box-sizing: border-box; border: 0; background: transparent; color: var(--card-foreground); font: inherit; text-align: left;' + (i > 0 ? ' border-top: 1px solid var(--border);' : ''),
          trackStyle: 'position: relative; flex-shrink: 0; width: 52px; height: 32px; border-radius: 9999px; background: ' + (on ? 'var(--primary)' : 'color-mix(in oklab, var(--muted-foreground) 40%, transparent)') + ';',
          knobStyle: 'position: absolute; top: 3px; left: ' + (on ? '23px' : '3px') + '; width: 26px; height: 26px; border-radius: 9999px; background: ' + (on ? 'var(--primary-foreground)' : 'var(--card)') + '; box-shadow: var(--shadow-soft);'
        };
      })
    };
  }
}
</script>
</body>
</html>
