<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/chronoflow/components/bundle.css">
<script src="ds/chronoflow/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Figtree';src:url("/_blob/74876cc764ebb15bf4ae98bcdbf3140c") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/741b1ce40b46479a73d934d0d5be9774") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/079d83fda74d66d1f31e35072f71201d") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/991830890debdac04981f1a27656ed5c") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url("/_blob/fc815083784d00806d267d81858d2414") format("woff2");font-weight:400 500;font-style:normal;font-display:swap}
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 375px; height: 812px; overflow: hidden; background: var(--background); color: var(--foreground); font-family: var(--font-sans);">
  <div style="position: absolute; inset: 0; overflow-y: auto;">
    <header class="ios ios-navbar">
      <span><a href="SetAccount.dc.html" class="ios ios-glass ios-back"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>Account</a></span>
      <span></span>
      <span></span>
    </header>

    <main style="padding: 4px 16px 40px; display: flex; flex-direction: column; gap: 24px;">
      <h1 class="ios-largetitle">Profile</h1>

      <x-import component-from-global-scope="ChronoFlow.Card">
        <div style="display: flex; flex-direction: column; gap: 16px;">
          <x-import component-from-global-scope="ChronoFlow.Field" id="name" label="Name" default-value="Rick Gout" autocomplete="name"></x-import>
          <x-import component-from-global-scope="ChronoFlow.Field" id="email" label="Email" type="email" default-value="rick.gout@example.org" autocomplete="email" hint="Was rick@example.com"></x-import>
        </div>
      </x-import>

      <section aria-labelledby="confirm-title" style="display: flex; flex-direction: column; gap: 12px;">
        <h2 id="confirm-title" style="margin: 0; font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted-foreground);">Verify your new email</h2>
        <x-import component-from-global-scope="ChronoFlow.Notice" tone="info">We'll send a verification link to rick.gout@example.org. Use your new address to sign in, here and on the web.</x-import>
      </section>

      <div style="display: grid; gap: 8px;">
        <a href="PasswordPromptEmail.dc.html" class="inline-flex shrink-0 items-center justify-center gap-2 text-sm font-medium whitespace-nowrap transition-colors rounded-full bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-6" style="height: 48px; text-decoration: none;">Save and send link</a>
        <p style="margin: 0; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; line-height: 18px; color: var(--muted-foreground);"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; color: var(--muted-foreground);"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>Changing your email asks for your password. Changing only your name doesn't.</p>
        <x-import component-from-global-scope="ChronoFlow.Button" variant="ghost" size="lg">Keep my current email</x-import>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
