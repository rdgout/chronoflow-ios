<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--background); font-family: var(--font-sans);">
  <!-- The app, already loaded underneath -->
  <div aria-hidden="true" style="position: absolute; inset: 0;">
    <sc-if value="{{toToday}}" hint-placeholder-val="{{ true }}"><dc-import name="Today" theme="{{theme}}" hint-size="390px,844px"></dc-import></sc-if>
    <sc-if value="{{toWelcome}}" hint-placeholder-val="{{ false }}"><dc-import name="Main" intro="{{yes}}" theme="{{theme}}" hint-size="390px,844px"></dc-import></sc-if>
  </div>

  <!-- Splash -->
  <div role="img" aria-label="ChronoFlow is opening" class="cfsp-move" style="{{st.splash}}">
    <div class="cf-sky cfsp-move" style="{{st.sky}}"></div>
    <div class="pattern-dots cfsp-move" aria-hidden="true" style="{{st.stars}}"></div>

    <!-- Sun rising over the horizon -->
    <div class="cfsp-move" aria-hidden="true" style="{{st.sun}}"></div>
    <div class="cfsp-move" aria-hidden="true" style="{{st.band}}"></div>

    <!-- Flight path across time zones -->
    <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; inset: 0;">
      <path class="cfsp-move" d="M -10 640 C 90 470, 300 470, 400 640" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.5" stroke-dasharray="560" style="{{st.arc}}"></path>
    </svg>
    <div class="cfsp-move" aria-hidden="true" style="{{st.plane}}"></div>

    <!-- Moon mark (the first frame matches the system launch screen) -->
    <svg class="cfsp-move" aria-hidden="true" width="104" height="104" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="{{st.icon}}"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
    <p class="cfsp-move" style="{{st.word}}">ChronoFlow</p>

    <sc-if value="{{slow}}" hint-placeholder-val="{{ false }}">
      <p role="status" class="cfsp-move" style="{{st.status}}">Getting your plan ready<span aria-hidden="true" style="display: inline-flex; gap: 3px; margin-left: 6px;"><span style="{{st.d1}}"></span><span style="{{st.d2}}"></span><span style="{{st.d3}}"></span></span></p>
    </sc-if>
  </div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"mode":{"editor":"enum","options":["ready","slow","welcome"],"default":"ready"},"at":{"editor":"int","default":-1,"min":-1,"max":7000},"$preview":{"width":390,"height":844}}'>

    const sfx = slow ? '-s' : welcome ? '-w' : '-r', dur = slow ? 7000 : welcome ? 5200 : 4200;
    const at = this.props.at;
    const frozen = at !== undefined && at !== null && at >= 0;
    const a = (n) => ' animation: cfsp-' + n + sfx + ' ' + dur + 'ms ' + (n === 'arc' || n === 'plane' ? 'linear' : 'ease-out') + ' infinite;' + (frozen ? ' animation-delay: -' + at + 'ms; animation-play-state: paused;' : '');
    const dot = (delay) => 'display: block; width: 4px; height: 4px; border-radius: 9999px; background: currentColor; animation: cfsp-dot 1200ms ease-in-out ' + delay + 'ms infinite;';

      theme: this.props.theme ?? 'light',
      slow, yes: true, toWelcome: welcome, toToday: !welcome,
      st: {
        splash: 'position: absolute; inset: 0; overflow: hidden; background: var(--sky-top); transform-origin: 50% 40%;' + a('out'),

        sun: 'position: absolute; left: 50%; top: 560px; width: 180px; height: 180px; border-radius: 9999px; background: radial-gradient(circle, var(--dawn) 0 55%, color-mix(in oklab, var(--dawn) 0%, transparent) 72%); box-shadow: 0 0 80px 20px color-mix(in oklab, var(--dawn) 45%, transparent);' + a('sun'),
        arc: a('arc').trim(),
        plane: "position: absolute; left: 0; top: 0; width: 8px; height: 8px; border-radius: 9999px; background: #fff; box-shadow: 0 0 10px 2px rgba(255,255,255,0.8); offset-path: path('M -10 640 C 90 470, 300 470, 400 640'); offset-rotate: 0deg;" + a('plane'),
        icon: 'position: absolute; left: 50%; top: 340px; width: 104px; height: 104px; color: var(--dawn); filter: drop-shadow(0 0 18px color-mix(in oklab, var(--dawn) 45%, transparent)); transform-origin: 50% 50%;' + a('icon'),
        word: 'position: absolute; left: 50%; top: 432px; margin: 0; white-space: nowrap; font-family: var(--font-display); font-size: 32px; line-height: 40px; letter-spacing: -0.01em; color: var(--sky-title);' + a('word'),
        status: 'position: absolute; left: 0; right: 0; top: 488px; margin: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; line-height: 20px; color: var(--sky-title); opacity: 0;' + a('status'),
        d1: dot(0), d2: dot(200), d3: dot(400)
      }
    };
  }
}
