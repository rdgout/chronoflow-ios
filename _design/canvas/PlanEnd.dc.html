<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trip plan, last day</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/chronoflow/components/bundle.css">
<script src="ds/chronoflow/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Plan" view="list" day="{{six}}" height="{{h}}" theme="{{theme}}" hint-size="390px,1500px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() { return { six: 6, h: 1500, theme: this.props.theme ?? 'light' }; }
}
</script>
</body>
</html>
