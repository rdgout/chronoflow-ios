<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create an account</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/chronoflow/components/bundle.css">
<script src="ds/chronoflow/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Figtree';src:url("/_blob/74876cc764ebb15bf4ae98bcdbf3140c") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/741b1ce40b46479a73d934d0d5be9774") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/079d83fda74d66d1f31e35072f71201d") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/991830890debdac04981f1a27656ed5c") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url("/_blob/fc815083784d00806d267d81858d2414") format("woff2");font-weight:400 500;font-style:normal;font-display:swap}
body{margin:0}
</style>
</helmet>
<div class="cf-sky" data-theme="{{theme}}" style="position: relative; width: 375px; height: 812px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; padding: 16px 16px 24px; color: var(--sky-title); font-family: var(--font-sans);">
  <div class="pattern-dots" aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.2; color: var(--sky-title); pointer-events: none;"></div>

  <div style="position: relative; display: flex; align-items: center; justify-content: space-between; height: 44px;">
    <a href="AuthSignIn.dc.html" aria-label="Back to sign in" style="display: grid; place-items: center; width: 44px; height: 44px; border-radius: 9999px; color: var(--sky-title);">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <span style="display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); font-size: 18px; line-height: 24px;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--dawn);"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>ChronoFlow</span>
    <span aria-hidden="true" style="width: 44px;"></span>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 8px; margin-top: 24px;">
    <h1 style="margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 36px; line-height: 40px; letter-spacing: -0.01em;">Create an account</h1>
    <p style="margin: 0; font-size: 16px; line-height: 24px;">Save your trips and get reminders on this phone.</p>
  </div>

  <div style="flex: 1;"></div>

  <section aria-label="Create an account" style="position: relative; display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 26px; background: var(--card); color: var(--card-foreground); box-shadow: var(--shadow-soft);">
    <sc-if value="{{err.show}}" hint-placeholder-val="{{ false }}"><div role="alert" style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 18px; background: color-mix(in oklab, var(--destructive) 10%, var(--card)); border: 1px solid color-mix(in oklab, var(--destructive) 35%, transparent); color: var(--card-foreground);"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px; color: var(--destructive);"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg><span style="flex: 1; font-size: 14px; line-height: 20px;"><span style="display: block; font-weight: 600;">{{err.title}}</span>{{err.body}}</span></div></sc-if>
    <x-import component-from-global-scope="ChronoFlow.Field" id="su-name" label="Name" default-value="Rick" autocomplete="name"></x-import>
    <x-import component-from-global-scope="ChronoFlow.Field" id="su-email" label="Email" type="email" default-value="rick@example.com" autocomplete="email"></x-import>
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <x-import component-from-global-scope="ChronoFlow.Field" id="su-pw" label="Password" type="{{pwType}}" default-value="sunrise-in-tokyo" autocomplete="new-password" hint="At least 10 characters."></x-import>
      <x-import component-from-global-scope="ChronoFlow.Field" id="su-pw2" label="Confirm password" type="{{pwType}}" default-value="sunrise-in-tokyo" autocomplete="new-password"></x-import>
      <button type="button" role="switch" aria-checked="{{showChecked}}" onClick="{{toggle}}" class="cf-press" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; margin-top: -10px; padding: 0 4px; border: 0; background: transparent; color: var(--foreground); font: inherit; font-size: 14px; font-weight: 500;">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
        {{showLabel}}
      </button>
    </div>
    <a href="AuthVerify.dc.html" class="inline-flex shrink-0 items-center justify-center gap-2 text-sm font-medium whitespace-nowrap transition-colors rounded-full bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-6" style="text-decoration: none;">Create account</a>
    <p style="margin: 0; font-size: 12px; line-height: 16px; color: var(--muted-foreground); text-align: center;">By creating an account you agree to the <a href="PolicyReader.dc.html" style="color: var(--foreground); text-decoration: underline; text-underline-offset: 0.2em;">terms and privacy policy</a>.</p>
  </section>

  <a href="AuthSignIn.dc.html" style="position: relative; margin-top: 12px; display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 9999px; background: var(--sky-copy-background); color: var(--sky-copy); font-size: 14px; line-height: 20px; font-weight: 500; text-decoration: none;">Already have an account? Sign in</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"error":{"editor":"enum","options":["none","taken","server"],"default":"none"},"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { show: false }; }
  renderVals() {
    const errs = { taken: { title: "There's already an account with this email.", body: 'Sign in instead, or reset your password.' }, server: { title: 'Something went wrong on our side.', body: 'Your details are kept. Try again in a moment.' } };
    const e = errs[this.props.error];
    const show = this.state.show;
    return {
      theme: this.props.theme ?? 'light', err: e ? { show: true, title: e.title, body: e.body } : { show: false, title: '', body: '' },
      pwType: show ? 'text' : 'password',
      showChecked: show ? 'true' : 'false',
      showLabel: show ? 'Hide password' : 'Show password',
      toggle: () => this.setState({ show: !this.state.show })
    };
  }
}
</script>
</body>
</html>
