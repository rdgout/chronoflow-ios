<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Language</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/chronoflow/components/bundle.css">
<script src="ds/chronoflow/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Figtree';src:url("/_blob/74876cc764ebb15bf4ae98bcdbf3140c") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/741b1ce40b46479a73d934d0d5be9774") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/079d83fda74d66d1f31e35072f71201d") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/991830890debdac04981f1a27656ed5c") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url("/_blob/fc815083784d00806d267d81858d2414") format("woff2");font-weight:400 500;font-style:normal;font-display:swap}
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 375px; height: 812px; overflow: hidden; background: var(--background); color: var(--foreground); font-family: var(--font-sans);">
  <div style="position: absolute; inset: 0; overflow-y: auto;">
    <header class="ios ios-navbar">
      <span><a href="SetAccount.dc.html" class="ios ios-glass ios-back"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>Account</a></span>
      <span></span>
      <span></span>
    </header>

    <main style="padding: 4px 16px 120px; display: flex; flex-direction: column; gap: 24px;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <h1 class="ios-largetitle">Language</h1>
        <p style="margin: 0; font-size: 16px; line-height: 24px; color: var(--muted-foreground);">ChronoFlow follows your phone's language, and uses English if your phone is set to a language we don't offer yet. Pick a language here only if you want something different.</p>
      </div>
      <div role="radiogroup" aria-label="Language" style="display: flex; flex-direction: column; gap: 8px;">
        <sc-for list="{{languages}}" as="l" hint-placeholder-count="2">
          <x-import component-from-global-scope="ChronoFlow.ChoiceCard" title="{{l.title}}" hint="{{l.hint}}" selected="{{l.selected}}" on-select="{{l.pick}}"></x-import>
        </sc-for>
      </div>
    </main>
  </div>

  <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 12px 16px; box-sizing: border-box; border-radius: 22px; border: 1px solid var(--border); background: var(--popover); color: var(--popover-foreground); box-shadow: var(--shadow-soft); font-size: 14px; line-height: 20px;">
    <span aria-hidden="true" style="display: grid; place-items: center; width: 24px; height: 24px; flex-shrink: 0; border-radius: 9999px; background: var(--dawn); color: var(--dawn-foreground);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span>
    <span style="flex: 1;">{{toast}}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: 'phone' };
  }
  renderVals() {
    const langs = [
      { id: 'phone', title: 'Phone language', hint: 'Now English · changes with your phone' },
      { id: 'en', title: 'English', hint: 'Always English' },
      { id: 'nl', title: 'Nederlands', hint: 'Always Dutch' }
    ];
    const toast = { phone: 'Saved. ChronoFlow follows your phone.', en: 'Saved. The app is in English.', nl: 'Opgeslagen. De app is in het Nederlands.' }[this.state.lang];
    return {
      theme: this.props.theme ?? 'light',
      toast,
      languages: langs.map((l) => ({ ...l, selected: this.state.lang === l.id, pick: () => this.setState({ lang: l.id }) }))
    };
  }
}
</script>
</body>
</html>
