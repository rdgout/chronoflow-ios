<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Password prompt</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/chronoflow/components/bundle.css">
<script src="ds/chronoflow/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Figtree';src:url("/_blob/74876cc764ebb15bf4ae98bcdbf3140c") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/741b1ce40b46479a73d934d0d5be9774") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/079d83fda74d66d1f31e35072f71201d") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/991830890debdac04981f1a27656ed5c") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url("/_blob/fc815083784d00806d267d81858d2414") format("woff2");font-weight:400 500;font-style:normal;font-display:swap}
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" lang="{{lang}}" style="position: relative; width: 375px; height: 812px; overflow: hidden; background: var(--background); color: var(--foreground); font-family: var(--font-sans);">
  <div aria-hidden="true" style="position: absolute; inset: 0;">
    <sc-if value="{{bg.email}}" hint-placeholder-val="{{ false }}"><dc-import name="SetProfile" theme="{{theme}}" hint-size="375px,812px"></dc-import></sc-if>
    <sc-if value="{{bg.delete}}" hint-placeholder-val="{{ false }}"><dc-import name="SetAccount" theme="{{theme}}" hint-size="375px,812px"></dc-import></sc-if>
    <sc-if value="{{bg.twofaOn}}" hint-placeholder-val="{{ false }}"><dc-import name="Set2FA" theme="{{theme}}" hint-size="375px,812px"></dc-import></sc-if>
    <sc-if value="{{bg.twofaOff}}" hint-placeholder-val="{{ false }}"><dc-import name="Set2FAManage" theme="{{theme}}" hint-size="375px,812px"></dc-import></sc-if>
    <sc-if value="{{bg.newCodes}}" hint-placeholder-val="{{ false }}"><dc-import name="Set2FAManage" theme="{{theme}}" hint-size="375px,812px"></dc-import></sc-if>
    <sc-if value="{{bg.showCodes}}" hint-placeholder-val="{{ false }}"><dc-import name="Set2FAManage" theme="{{theme}}" hint-size="375px,812px"></dc-import></sc-if>
  </div>
  <a href="{{cancelHref}}" aria-label="{{t.cancel}}" style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.25);"></a>

  <!-- One shared prompt for every sensitive action: a native sheet with the system secure field -->
  <section role="dialog" aria-modal="true" aria-labelledby="pw-title" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 38px 38px 0 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 10px 20px 32px; background: var(--card); color: var(--card-foreground); box-shadow: var(--shadow-soft);">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 9999px; background: rgba(120, 120, 128, 0.4);"></span>
    <div class="ios" style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px;">
      <a href="{{cancelHref}}" style="justify-self: start; font-size: 17px; line-height: 22px; color: var(--dawn-text); text-decoration: none;">{{t.cancel}}</a>
      <h2 id="pw-title" style="margin: 0; font-size: 17px; line-height: 22px; font-weight: 600;">{{t.title}}</h2>
      <span></span>
    </div>
    <p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--muted-foreground);">{{t.desc}}</p>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="pw-field" class="ios" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">{{t.field}}</label>
      <div class="ios" style="{{fieldStyle}}">
        <span id="pw-field" role="textbox" aria-disabled="{{fieldDisabled}}" aria-invalid="{{invalid}}" aria-describedby="pw-msg" style="{{valueStyle}}">{{fieldValue}}</span>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; color: rgba(120, 120, 128, 0.8);"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <sc-if value="{{hasMsg}}" hint-placeholder-val="{{ false }}">
        <p id="pw-msg" role="alert" style="margin: 0; display: flex; gap: 6px; font-size: 14px; line-height: 20px; color: var(--destructive);"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>{{msg}}</p>
      </sc-if>
      <a href="PasswordPromptForgot.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 40px; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--foreground); text-decoration: underline; text-underline-offset: 0.2em;">{{t.forgot}}</a>
    </div>

    <a href="{{okHref}}" aria-disabled="{{btnDisabled}}" class="inline-flex shrink-0 items-center justify-center gap-2 text-sm font-medium whitespace-nowrap transition-colors rounded-full h-10 px-6" style="{{btnStyle}}">
      <sc-if value="{{checking}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" class="animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg></sc-if>
      {{btnLabel}}
    </a>
  </section>

  <sc-if value="{{forgot}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; display: grid; place-items: center; padding: 0 24px; background: rgba(0, 0, 0, 0.2);">
      <section role="alertdialog" aria-modal="true" aria-labelledby="fg-title" class="ios ios-glass ios-alert" style="background: color-mix(in oklab, var(--card) 82%, transparent);">
        <h2 id="fg-title">{{t.fTitle}}</h2>
        <p>{{t.fBody}}</p>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px;"><a href="PasswordPromptEmail.dc.html" class="ios-alert-btn">{{t.cancel}}</a><a href="PasswordPromptEmail.dc.html" class="ios-alert-btn" data-role="default">{{t.fSend}}</a></div>
      </section>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"action":{"editor":"enum","options":["email","delete","twofaOn","twofaOff","newCodes","showCodes"],"default":"showCodes"},"state":{"editor":"enum","options":["empty","checking","wrong","locked"],"default":"empty"},"lang":{"editor":"enum","options":["en","nl"],"default":"en"},"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  renderVals() {
    const COPY = {"en": {"title": "Confirm it's you", "fTitle": "Reset your password?", "fBody": "We'll email a reset link to rick@example.com. You stay signed in on this phone.", "fSend": "Send link", "cancel": "Cancel", "field": "Password", "forgot": "Forgot password?", "checking": "Checking…", "wrong": "The provided password was incorrect.", "locked": "Too many attempts. Try again in 60 seconds.", "email": ["Enter your password to change your email to rick.gout@example.org.", "Change email"], "delete": ["Enter your password to delete your account. This can't be undone.", "Delete account"], "twofaOn": ["Enter your password to turn on two-factor authentication.", "Continue"], "twofaOff": ["Enter your password to turn off two-factor authentication.", "Turn off"], "newCodes": ["Enter your password to make new recovery codes. Your current codes stop working.", "Make new codes"], "showCodes": ["Enter your password to show your recovery codes.", "Show codes"]}, "nl": {"title": "Bevestig dat jij het bent", "fTitle": "Wachtwoord opnieuw instellen?", "fBody": "We sturen een link naar rick@example.com. Je blijft op deze telefoon aangemeld.", "fSend": "Link sturen", "cancel": "Annuleren", "field": "Wachtwoord", "forgot": "Wachtwoord vergeten?", "checking": "Controleren…", "wrong": "Het opgegeven wachtwoord is onjuist.", "locked": "Te veel pogingen. Probeer het over 60 seconden opnieuw.", "email": ["Voer je wachtwoord in om je e-mailadres te wijzigen in rick.gout@example.org.", "E-mailadres wijzigen"], "delete": ["Voer je wachtwoord in om je account te verwijderen. Dit kun je niet ongedaan maken.", "Account verwijderen"], "twofaOn": ["Voer je wachtwoord in om tweestapsverificatie aan te zetten.", "Doorgaan"], "twofaOff": ["Voer je wachtwoord in om tweestapsverificatie uit te zetten.", "Uitzetten"], "newCodes": ["Voer je wachtwoord in om nieuwe herstelcodes te maken. Je huidige codes werken dan niet meer.", "Nieuwe codes maken"], "showCodes": ["Voer je wachtwoord in om je herstelcodes te tonen.", "Codes tonen"]}};
    const BG = {"email": ["SetProfile", "SetProfile.dc.html", "SetProfile.dc.html"], "delete": ["SetAccount", "SetDelete.dc.html", "Main.dc.html"], "twofaOn": ["Set2FA", "Set2FA.dc.html", "Set2FASetup.dc.html"], "twofaOff": ["Set2FAManage", "Set2FAManage.dc.html", "Set2FA.dc.html"], "newCodes": ["Set2FAManage", "Set2FAManage.dc.html", "Set2FACodes.dc.html"], "showCodes": ["Set2FAManage", "Set2FAManage.dc.html", "Set2FACodes.dc.html"]};
    const lang = this.props.lang === 'nl' ? 'nl' : 'en';
    const action = this.props.action ?? 'showCodes';
    const st = this.props.state ?? 'empty';
    const c = COPY[lang];
    const t = { ...c, desc: c[action][0] };
    const destructive = action === 'delete' || action === 'twofaOff';
    const busy = st === 'checking', locked = st === 'locked', wrong = st === 'wrong';
    const bg = {};
    for (const k in BG) bg[k] = k === action;
    const filled = st !== 'empty';
    return {
      theme: this.props.theme ?? 'light', lang, t, bg, forgot: !!this.props.forgot,
      cancelHref: BG[action][1], okHref: (busy || locked) ? '#' : BG[action][2],
      fieldStyle: 'display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 16px; box-sizing: border-box; border-radius: 12px; background: rgba(118, 118, 128, 0.12);' + (wrong ? ' box-shadow: inset 0 0 0 2px var(--destructive);' : '') + (busy || locked ? ' opacity: 0.55;' : ''),
      valueStyle: 'flex: 1; min-width: 0; font-size: 17px; line-height: 22px; letter-spacing: ' + (filled ? '0.18em' : 'normal') + '; color: ' + (filled ? 'var(--foreground)' : 'rgba(120, 120, 128, 0.85)') + ';',
      fieldValue: filled ? '••••••••••' : c.field,
      fieldDisabled: (busy || locked) ? 'true' : 'false', invalid: wrong ? 'true' : 'false',
      hasMsg: wrong || locked, msg: wrong ? c.wrong : locked ? c.locked : '',
      checking: busy,
      btnLabel: busy ? c.checking : c[action][1],
      btnDisabled: (busy || locked || st === 'empty') ? 'true' : 'false',
      btnStyle: 'height: 50px; text-decoration: none; font-size: 16px; font-weight: 600; ' + (destructive ? 'background: var(--destructive); color: var(--destructive-foreground);' : 'background: var(--primary); color: var(--primary-foreground);') + ((busy || locked || st === 'empty') ? ' opacity: 0.45; pointer-events: none;' : '')
    };
  }
}
</script>
</body>
</html>
