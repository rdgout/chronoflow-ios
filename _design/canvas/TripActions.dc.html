<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trip actions</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/chronoflow/components/bundle.css">
<script src="ds/chronoflow/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Figtree';src:url("/_blob/74876cc764ebb15bf4ae98bcdbf3140c") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/741b1ce40b46479a73d934d0d5be9774") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/079d83fda74d66d1f31e35072f71201d") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/991830890debdac04981f1a27656ed5c") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url("/_blob/fc815083784d00806d267d81858d2414") format("woff2");font-weight:400 500;font-style:normal;font-display:swap}
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--background); color: var(--foreground); font-family: var(--font-sans);">
  <div aria-hidden="true" style="position: absolute; inset: 0;">
    <dc-import name="Plan" no-plan="{{noPlan}}" theme="{{theme}}" hint-size="390px,844px"></dc-import>
  </div>
  <a href="Plan.dc.html" aria-label="Close" style="position: absolute; inset: 0; background: oklch(0.15 0.03 272 / 0.5);"></a>

  <section role="dialog" aria-modal="true" aria-labelledby="ta-title" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 32px; border-radius: 38px 38px 0 0; background: var(--card); color: var(--card-foreground); box-shadow: var(--shadow-soft);">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 9999px; background: rgba(120, 120, 128, 0.4);"></span>
    <div style="padding: 0 4px;">
      <h2 id="ta-title" style="margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 32px; letter-spacing: -0.01em;">Amsterdam → Tokyo</h2>
      <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--muted-foreground); font-variant-numeric: tabular-nums;">12–22 Oct · via Dubai · with return</p>
    </div>

    <div style="border-radius: 22px; background: var(--surface-2); overflow: hidden;">
      <a href="TripEditor.dc.html" class="cf-press" style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 16px; box-sizing: border-box; color: var(--foreground); text-decoration: none;">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"></path></svg>
        <span style="flex: 1; font-size: 16px; line-height: 24px; font-weight: 500;">Edit trip</span>
      </a>
      <button type="button" class="cf-press" style="display: flex; width: 100%; align-items: center; gap: 14px; min-height: 56px; padding: 8px 16px; box-sizing: border-box; border: 0; border-top: 1px solid var(--border); background: transparent; color: var(--foreground); font: inherit; text-align: left;">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
        <span style="flex: 1;"><span style="display: block; font-size: 16px; line-height: 24px; font-weight: 500;">Duplicate trip</span><span style="display: block; font-size: 14px; line-height: 20px; color: var(--muted-foreground);">Same flights and answers, new dates</span></span>
      </button>
<sc-if value="{{hasPlan}}" hint-placeholder-val="{{ true }}">
      <a href="CalendarExport.dc.html" class="cf-press" style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 16px; box-sizing: border-box; border-top: 1px solid var(--border); color: var(--foreground); text-decoration: none;">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"></rect><line x1="16" x2="16" y1="2" y2="6"></line><line x1="8" x2="8" y1="2" y2="6"></line><line x1="3" x2="21" y1="10" y2="10"></line></svg>
        <span style="flex: 1;"><span style="display: block; font-size: 16px; line-height: 24px; font-weight: 500;">Add to calendar</span><span style="display: block; font-size: 14px; line-height: 20px; color: var(--muted-foreground);">Choose steps and alerts</span></span>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--muted-foreground);"><path d="m9 18 6-6-6-6"></path></svg>
      </a>
      </sc-if>
      <sc-if value="{{noPlan}}" hint-placeholder-val="{{ false }}">
      <div aria-disabled="true" style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 16px; box-sizing: border-box; border-top: 1px solid var(--border); color: var(--foreground); opacity: 0.5;">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"></rect><line x1="16" x2="16" y1="2" y2="6"></line><line x1="8" x2="8" y1="2" y2="6"></line><line x1="3" x2="21" y1="10" y2="10"></line></svg>
        <span style="flex: 1;"><span style="display: block; font-size: 16px; line-height: 24px; font-weight: 500;">Add to calendar</span><span style="display: block; font-size: 14px; line-height: 20px; color: var(--muted-foreground);">Available once the plan is made</span></span>
      </div>
      </sc-if>
      <button type="button" class="cf-press" style="display: flex; width: 100%; align-items: center; gap: 14px; min-height: 56px; padding: 8px 16px; box-sizing: border-box; border: 0; border-top: 1px solid var(--border); background: transparent; color: var(--foreground); font: inherit; text-align: left;">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>
        <span style="flex: 1; font-size: 16px; line-height: 24px; font-weight: 500;">Mark trip as completed</span>
      </button>
    </div>

    <div style="border-radius: 22px; background: var(--surface-2); overflow: hidden;">
      <a href="TripDelete.dc.html" class="cf-press" style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 16px; box-sizing: border-box; color: var(--destructive); text-decoration: none;">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
        <span style="flex: 1; font-size: 16px; line-height: 24px; font-weight: 500;">Delete trip</span>
      </a>
    </div>

    <a href="Plan.dc.html" class="inline-flex shrink-0 items-center justify-center gap-2 text-sm font-medium whitespace-nowrap transition-colors rounded-full hover:bg-accent hover:text-accent-foreground h-10 px-6" style="color: var(--foreground); text-decoration: none;">Cancel</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"noPlan":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light', noPlan: !!this.props.noPlan, hasPlan: !this.props.noPlan };
  }
}
</script>
</body>
</html>
