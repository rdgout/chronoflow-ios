<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wizard · Edit · add return, no credits · dark, Dutch</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/chronoflow/components/bundle.css">
<script src="ds/chronoflow/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Wizard" screen="ready" v="editreturnnone" lang="nl" pct="{{pct}}" theme="{{theme}}" hint-size="390px,844px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { pct: 100, theme: this.props.theme ?? 'dark' }; }
}
</script>
</body>
</html>
