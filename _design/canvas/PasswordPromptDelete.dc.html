<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Password prompt · delete account</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/chronoflow/components/bundle.css">
<script src="ds/chronoflow/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="PasswordPrompt" action="delete" theme="{{theme}}" hint-size="375px,812px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true, theme: this.props.theme ?? 'light' }; }
}
</script>
</body>
</html>
