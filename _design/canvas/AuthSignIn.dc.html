</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Figtree';src:url("/_blob/74876cc764ebb15bf4ae98bcdbf3140c") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/741b1ce40b46479a73d934d0d5be9774") format("woff2");font-weight:500;font-style:normal;font-display:swap}

<div class="cf-sky" data-theme="{{theme}}" style="position: relative; width: 375px; height: 812px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; padding: 16px 16px 24px; color: var(--sky-title); font-family: var(--font-sans);">
  <div class="pattern-dots" aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.2; color: var(--sky-title); pointer-events: none;"></div>

  <div style="position: relative; display: flex; align-items: center; justify-content: space-between; height: 44px;">
    <a href="Main.dc.html" aria-label="Back" style="display: grid; place-items: center; width: 44px; height: 44px; border-radius: 9999px; color: var(--sky-title);">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <span style="display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); font-size: 18px; line-height: 24px;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--dawn);"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>ChronoFlow</span>
    <span aria-hidden="true" style="width: 44px;"></span>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 8px; margin-top: 32px;">
    <h1 style="margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 36px; line-height: 40px; letter-spacing: -0.01em;">Welcome back</h1>
    <p style="margin: 0; font-size: 16px; line-height: 24px;">Sign in to see your trips and plans.</p>
  </div>

  <div style="flex: 1;"></div>

  <section aria-label="Sign in" style="position: relative; display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 26px; background: var(--card); color: var(--card-foreground); box-shadow: var(--shadow-soft);">
    <sc-if value="{{err.show}}" hint-placeholder-val="{{ false }}"><div role="alert" style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 18px; background: color-mix(in oklab, var(--destructive) 10%, var(--card)); border: 1px solid color-mix(in oklab, var(--destructive) 35%, transparent); color: var(--card-foreground);"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px; color: var(--destructive);"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg><span style="flex: 1; font-size: 14px; line-height: 20px;"><span style="display: block; font-weight: 600;">{{err.title}}</span>{{err.body}}</span></div></sc-if>
    <div style="display: grid;">
      <x-import component-from-global-scope="ChronoFlow.Button" size="lg">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"></path><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle></svg>
        Sign in with a passkey
      </x-import>
    </div>
    <div aria-hidden="true" style="display: flex; align-items: center; gap: 12px; font-size: 12px; line-height: 16px; color: var(--muted-foreground);"><span style="flex: 1; border-top: 1px solid var(--border);"></span>or with email<span style="flex: 1; border-top: 1px solid var(--border);"></span></div>
    <x-import component-from-global-scope="ChronoFlow.Field" id="si-email" label="Email" type="email" default-value="rick@example.com" autocomplete="email"></x-import>
    <x-import component-from-global-scope="ChronoFlow.Field" id="si-pw" label="Password" type="password" default-value="password12" autocomplete="current-password"></x-import>
    <a href="AuthTwoFactor.dc.html" class="inline-flex shrink-0 items-center justify-center gap-2 text-sm font-medium whitespace-nowrap transition-colors rounded-full border border-input bg-background hover:bg-accent hover:text-accent-foreground h-10 px-6" style="color: var(--foreground); text-decoration: none;">Sign in</a>
    <div style="display: flex; justify-content: space-between; gap: 8px;">
      <a href="AuthForgot.dc.html" class="cf-press" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--foreground); text-decoration: underline; text-underline-offset: 0.2em;">Forgot your password?</a>
      <a href="AuthSignUp.dc.html" class="cf-press" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--dawn-text); text-decoration: underline; text-underline-offset: 0.2em;">Create an account</a>
    </div>
  </section>

  <a href="GuestFlight.dc.html" style="position: relative; margin-top: 12px; display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 9999px; background: var(--sky-copy-background); color: var(--sky-copy); font-size: 14px; line-height: 20px; font-weight: 500; text-decoration: none;">New here? Plan a trip first</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"error":{"editor":"enum","options":["none","wrong","locked","server"],"default":"none"},"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  renderVals() {
    const errs = { wrong: { title: "That email and password don't match.", body: 'Check both and try again, or reset your password.' }, locked: { title: 'Too many attempts.', body: 'Wait a few minutes before you try again, or reset your password now.' }, server: { title: 'Something went wrong on our side.', body: 'Try again in a moment.' } };
    const e = errs[this.props.error];
    return { theme: this.props.theme ?? 'light', err: e ? { show: true, title: e.title, body: e.body } : { show: false, title: '', body: '' } };
  }
}
</script>
</body>
</html>
